name: ATC Test Suite

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cargo-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy, rust-src, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: cargo test ueber alle Manifeste (SCR-0078, F-093)
        run: |
          set +e
          FAIL=0
          while IFS= read -r f; do
            d="$(dirname "$f")"
            if [ "$d" = "./modules/atc-shivacore/boot" ]; then
              echo "SKIP $d: boot-image builder has no unit tests; exercised by the dedicated ShivaCore boot workflow."
              continue
            fi
            echo "=== cargo test in $d"
            if ! (cd "$d" && cargo +nightly test --quiet); then
              echo "cargo test FAILED in $d"
              FAIL=1
            fi
          done < <(find . -name Cargo.toml -not -path "*/archive/*" -not -path "*/node_modules/*")
          exit "$FAIL"

  npm-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm install + test/build (SCR-0078, F-093)
        run: |
          set +e
          FAIL=0
          while IFS= read -r f; do
            d="$(dirname "$f")"
            echo "=== npm in $d"
            if ! (cd "$d" && npm install --no-audit --no-fund --silent); then
              echo "npm install FAILED in $d"
              FAIL=1
              continue
            fi
            (cd "$d" && npm test --if-present --silent) || { echo "npm test FAILED in $d"; FAIL=1; }
            (cd "$d" && npm run build --if-present --silent) || { echo "npm build FAILED in $d"; FAIL=1; }
          done < <(find . -name package.json -not -path "*/archive/*" -not -path "*/node_modules/*" -not -path "*/.*/*")
          exit "$FAIL"

  evidence:
    if: ${{ success() }}
    needs: [cargo-tests, npm-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Generate exact-SHA test evidence
        env:
          EVIDENCE_SHA: ${{ github.sha }}
          EVIDENCE_RUN_ID: ${{ github.run_id }}
          EVIDENCE_WORKFLOW: ${{ github.workflow }}
          EVIDENCE_OUTPUT: ${{ runner.temp }}/atc-test-evidence.yaml
        run: |
          python3 - <<'PY'
          import datetime
          import os
          import re

          sha = os.environ["EVIDENCE_SHA"]
          rid = os.environ["EVIDENCE_RUN_ID"]
          wf = os.environ.get("EVIDENCE_WORKFLOW", "ATC Test Suite")
          ts = datetime.datetime.now(datetime.timezone.utc).isoformat()
          source = ".atc/evidence/evidence.yaml"
          text = open(source, encoding="utf-8").read()
          text, count = re.subn(r"(?m)^bound_commit: [^\n]*", "bound_commit: " + sha, text, count=1)
          if count != 1:
              raise SystemExit("Expected exactly one top-level bound_commit field")
          block = (
              "test_run:\n"
              "  workflow: " + wf + "\n"
              "  run_id: " + rid + "\n"
              "  commit: " + sha + "\n"
              "  timestamp: " + ts + "\n"
              "  result: PASS\n"
              "  runner: github-actions\n"
          )
          if re.search(r"(?m)^test_run:\n(?:  [^\n]*\n)+", text):
              text = re.sub(r"(?m)^test_run:\n(?:  [^\n]*\n)+", lambda _: block, text, count=1)
          else:
              text = text.rstrip() + "\n" + block
          with open(os.environ["EVIDENCE_OUTPUT"], "w", encoding="utf-8") as output:
              output.write(text)
          print(f"Generated test evidence for SHA {sha}, run {rid}")
          PY
      - name: Upload evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: atc-test-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/atc-test-evidence.yaml
          if-no-files-found: error
          retention-days: 90
