name: ATC Test Suite

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cargo-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy, rust-src, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: cargo test ueber alle Manifeste (SCR-0078, F-093)
        run: |
          set +e
          FAIL=0
          while IFS= read -r f; do
            d="$(dirname "$f")"
            if [ "$d" = "./modules/atc-shivacore/boot" ]; then
              echo "SKIP $d: boot-image builder has no unit tests; exercised by the dedicated ShivaCore boot workflow."
              continue
            fi
            echo "=== cargo test in $d"
            if ! (cd "$d" && cargo +nightly test --quiet); then
              echo "cargo test FAILED in $d"
              FAIL=1
            fi
          done < <(find . -name Cargo.toml -not -path "*/archive/*" -not -path "*/node_modules/*")
          exit "$FAIL"

  npm-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm install + test/build (SCR-0078, F-093)
        run: |
          set +e
          FAIL=0
          while IFS= read -r f; do
            d="$(dirname "$f")"
            echo "=== npm in $d"
            if ! (cd "$d" && npm install --no-audit --no-fund --silent); then
              echo "npm install FAILED in $d"
              FAIL=1
              continue
            fi
            (cd "$d" && npm test --if-present --silent) || { echo "npm test FAILED in $d"; FAIL=1; }
            (cd "$d" && npm run build --if-present --silent) || { echo "npm build FAILED in $d"; FAIL=1; }
          done < <(find . -name package.json -not -path "*/archive/*" -not -path "*/node_modules/*" -not -path "*/.*/*")
          exit "$FAIL"

  evidence:
    if: ${{ always() && needs.cargo-tests.result == 'success' && needs.npm-tests.result == 'success' }}
    needs: [cargo-tests, npm-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Regression-test fail-closed validator
        working-directory: tools/ci
        run: python3 -m unittest test_fail_closed_evidence -v
      - name: Validate evidence contract before writing PASS (SCR-0086)
        env:
          CARGO_RESULT: ${{ needs.cargo-tests.result }}
          NPM_RESULT: ${{ needs.npm-tests.result }}
        run: |
          set -euo pipefail
          test "$CARGO_RESULT" = "success"
          test "$NPM_RESULT" = "success"
          python3 - <<'PY'
          import datetime
          import json
          import os
          import re
          import subprocess
          import sys

          repo = os.environ.get("GITHUB_REPOSITORY", "")
          sha = os.environ.get("GITHUB_SHA", "")
          run_id = os.environ.get("GITHUB_RUN_ID", "")
          workflow = os.environ.get("GITHUB_WORKFLOW", "")
          cargo = os.environ.get("CARGO_RESULT", "")
          npm = os.environ.get("NPM_RESULT", "")

          # Reject absent or malformed identity fields before creating any PASS claim.
          if not re.fullmatch(r"[^/]+/[^/]+", repo):
              sys.exit("FAIL-CLOSED: GITHUB_REPOSITORY missing or malformed")
          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              sys.exit("FAIL-CLOSED: GITHUB_SHA must be a full 40-character lowercase SHA")
          if not run_id.isdigit() or int(run_id) <= 0:
              sys.exit("FAIL-CLOSED: GITHUB_RUN_ID missing or invalid")
          if not workflow:
              sys.exit("FAIL-CLOSED: GITHUB_WORKFLOW missing")
          if cargo != "success" or npm != "success":
              sys.exit("FAIL-CLOSED: prerequisite job result is not success")

          contract = {
              "repository": repo,
              "sha": sha,
              "run_id": run_id,
              "job_results": {"cargo-tests": cargo, "npm-tests": npm},
          }
          checked = subprocess.run(
              [sys.executable, "tools/ci/fail_closed_evidence.py", "--repo", repo, "--sha", sha],
              input=json.dumps(contract), text=True, capture_output=True, check=False,
          )
          print(checked.stdout, end="")
          if checked.stderr:
              print(checked.stderr, file=sys.stderr, end="")
          if checked.returncode != 0:
              sys.exit("FAIL-CLOSED: validator rejected evidence contract")

          timestamp = datetime.datetime.now(datetime.timezone.utc).isoformat()
          path = ".atc/evidence/evidence.yaml"
          with open(path, encoding="utf-8") as stream:
              text = stream.read()
          text = re.sub(r"(?m)^bound_commit: [^\n]*", "bound_commit: " + sha, text)
          block = (
              "test_run:\n"
              "  workflow: " + workflow + "\n"
              "  run_id: " + run_id + "\n"
              "  commit: " + sha + "\n"
              "  timestamp: " + timestamp + "\n"
              "  result: PASS\n"
              "  scope: cargo-tests,npm-tests\n"
              "  cargo_job_result: " + cargo + "\n"
              "  npm_job_result: " + npm + "\n"
              "  runner: github-actions\n"
          )
          if re.search(r"(?m)^test_run:\n(?:  [^\n]*\n)+", text):
              text = re.sub(r"(?m)^test_run:\n(?:  [^\n]*\n)+", lambda _: block, text)
          else:
              text = text.rstrip() + "\n" + block
          with open(path, "w", encoding="utf-8") as stream:
              stream.write(text)
          PY
      - name: Publish SHA-bound evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: scr-0086-evidence-${{ github.run_id }}
          path: .atc/evidence/evidence.yaml
          if-no-files-found: error
          retention-days: 90
