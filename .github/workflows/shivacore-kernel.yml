name: ShivaCore Kernel Boot

on:
  push:
    branches: [main]
    paths:
      - "modules/atc-shivacore/kernel/**"
      - "modules/atc-shivacore/boot/**"
      - "Cargo.toml"
      - ".github/workflows/shivacore-kernel.yml"
  pull_request:
    paths:
      - "modules/atc-shivacore/kernel/**"
      - "modules/atc-shivacore/boot/**"
      - "Cargo.toml"
      - ".github/workflows/shivacore-kernel.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boot:
    name: Build and smoke-test ShivaCore (${{ matrix.cpu }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - cpu: intel-skylake
            qemu_cpu: Skylake-Client-v1
            expected_vendor: Intel
          - cpu: amd-epyc
            qemu_cpu: EPYC
            expected_vendor: AMD
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-none
          components: llvm-tools-preview, rust-src

      - name: Build kernel ELF
        env:
          RUSTFLAGS: '-C target-cpu=x86-64 --cfg curve25519_dalek_backend="serial"'
        run: |
          cargo build -p shivacore --release \
            --target x86_64-unknown-none \
            --features x86-boot

      - name: Build BIOS and UEFI images
        run: |
          mkdir -p target/boot-images
          cargo run -p boot --release -- \
            target/x86_64-unknown-none/release/shivacore \
            target/boot-images

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86

      - name: Verify QEMU CPU model
        run: qemu-system-x86_64 -cpu help | grep -E '^[[:space:]]*x86[[:space:]]+${{ matrix.qemu_cpu }}([[:space:]]|$)'

      - name: BIOS boot smoke test (${{ matrix.cpu }})
        run: |
          set +e
          timeout 20s qemu-system-x86_64 \
            -cpu ${{ matrix.qemu_cpu }} \
            -drive format=raw,file=target/boot-images/shivacore-bios.img \
            -serial stdio \
            -display none \
            -no-reboot \
            -no-shutdown 2>&1 | tee target/shivacore-qemu-${{ matrix.cpu }}.log
          status=${PIPESTATUS[0]}
          if ! grep -q "ShivaCore: Kernel-Einstiegspunkt erreicht." target/shivacore-qemu-${{ matrix.cpu }}.log; then
            echo "ShivaCore did not reach kernel_main."
            exit 1
          fi
          if ! grep -q "ShivaCore: CPU vendor=${{ matrix.expected_vendor }} " target/shivacore-qemu-${{ matrix.cpu }}.log; then
            echo "CPU vendor detection did not match expected ${{ matrix.expected_vendor }}."
            cat target/shivacore-qemu-${{ matrix.cpu }}.log
            exit 1
          fi
          if ! grep -q "ShivaCore: CPU HAL compatibility check OK." target/shivacore-qemu-${{ matrix.cpu }}.log; then
            echo "CPU HAL compatibility gate did not pass."
            exit 1
          fi
          if ! grep -q "ShivaCore: USER-001 mapped PID=1000" target/shivacore-qemu-${{ matrix.cpu }}.log; then
            echo "USER-001 did not install the first Ring-3 process."
            exit 1
          fi
          if ! grep -q "ShivaCore: SCHED-001 scheduler armed: PID=1000 + PID=1001" target/shivacore-qemu-${{ matrix.cpu }}.log; then
            echo "SCHED-001 scheduler was not armed with two Ring-3 processes."
            exit 1
          fi
          if ! grep -q "ShivaCore: USER-001 entering PID=1000" target/shivacore-qemu-${{ matrix.cpu }}.log; then
            echo "Kernel did not attempt the real Ring-3 IRETQ entry."
            exit 1
          fi
          if ! grep -q "ShivaCore: scheduler preemption -> context switch to PID=1001" target/shivacore-qemu-${{ matrix.cpu }}.log; then
            echo "Timer IRQ did not drive a real scheduler preemption to PID=1001."
            exit 1
          fi
          if ! grep -q "ShivaCore: KernelState::boot() -> Done." target/shivacore-qemu-${{ matrix.cpu }}.log; then
            echo "Canonical KernelState::boot() was not reached from kernel_main."
            exit 1
          fi
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            echo "QEMU exited unexpectedly with status $status."
            exit "$status"
          fi

      - name: Upload boot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shivacore-boot-images-${{ matrix.cpu }}
          path: |
            target/boot-images/shivacore-bios.img
            target/boot-images/shivacore-uefi.img
            target/shivacore-qemu-${{ matrix.cpu }}.log
