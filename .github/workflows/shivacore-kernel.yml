name: ShivaCore Kernel Boot

on:
  push:
    branches: [main]
    paths:
      - "modules/atc-shivacore/kernel/**"
      - "modules/atc-shivacore/boot/**"
      - "Cargo.toml"
      - ".github/workflows/shivacore-kernel.yml"
  pull_request:
    paths:
      - "modules/atc-shivacore/kernel/**"
      - "modules/atc-shivacore/boot/**"
      - "Cargo.toml"
      - ".github/workflows/shivacore-kernel.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boot:
    name: Build and smoke-test ShivaCore (${{ matrix.cpu }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - cpu: intel-skylake
            qemu_cpu: Skylake-Client-v1
            expected_vendor: Intel
          - cpu: amd-epyc
            qemu_cpu: EPYC
            expected_vendor: AMD
    steps:
      - uses: actions/checkout@v4

      # Nightly ist hier technisch noetig (bootloader/build-std) und laesst sich
      # nicht auf eine Versionsnummer fixieren; die Zeilen unten halten die
      # tatsaechlich benutzte Version fest, damit ein Wechsel auffaellt.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-none
          components: llvm-tools-preview, rust-src
      - name: Toolchain festhalten
        run: |
          rustup show active-toolchain
          rustc -Vv
          cargo -V

      - name: Build kernel ELF
        id: build_kernel
        env:
          RUSTFLAGS: '-C target-cpu=x86-64 --cfg curve25519_dalek_backend="serial"'
        run: |
          # The repository root pins stable 1.100.0; the kernel's build-std
          # target is installed on nightly by dtolnay/rust-toolchain above.
          cargo +nightly build -p shivacore --release \
            --target x86_64-unknown-none \
            --features x86-boot

      - name: Build init program (ramdisk payload)
        id: build_init
        run: |
          # Ohne RUSTFLAGS: die Crate-Konfiguration setzt -Tlinker.ld (feste
          # Ladeadresse 0x400000) und relocation-model=static. Eine
          # RUSTFLAGS-Variable wuerde diese Einstellungen ersetzen.
          ( cd modules/atc-shivacore/init_program && env -u RUSTFLAGS cargo +nightly build --release --target x86_64-unknown-none )

      - name: Capture init ELF program-header evidence
        id: init_elf_evidence
        shell: bash
        run: |
          set -euo pipefail
          elf="$GITHUB_WORKSPACE/modules/atc-shivacore/init_program/target/x86_64-unknown-none/release/shivacore-init"
          mkdir -p target/elf-evidence
          test -s "$elf"
          cp "$elf" target/elf-evidence/shivacore-init.elf
          readelf -lW "$elf" | tee target/elf-evidence/init-elf-program-headers.txt
          python3 - "$elf" <<'PY'
          import json
          import pathlib
          import re
          import sys

          elf = pathlib.Path(sys.argv[1])
          raw = pathlib.Path("target/elf-evidence/init-elf-program-headers.txt").read_text()
          loads = []
          for line in raw.splitlines():
              parts = line.split()
              if not parts or parts[0] != "LOAD":
                  continue
              if len(parts) < 8:
                  raise SystemExit(f"Unparseable PT_LOAD row: {line}")
              offset, vaddr, _paddr, filesz, memsz = (
                  int(value, 16) for value in parts[1:6]
              )
              flags = " ".join(parts[6:-1])
              align = int(parts[-1], 16)
              loads.append({
                  "p_offset": offset,
                  "p_vaddr": vaddr,
                  "p_filesz": filesz,
                  "p_memsz": memsz,
                  "p_align": align,
                  "p_flags": flags,
              })

          issues = []
          if not loads:
              issues.append("No PT_LOAD program headers found")

          for index, segment in enumerate(loads):
              if segment["p_filesz"] > segment["p_memsz"]:
                  issues.append(f"PT_LOAD[{index}]: p_filesz exceeds p_memsz")
              align = segment["p_align"]
              if align > 1:
                  if align & (align - 1):
                      issues.append(f"PT_LOAD[{index}]: p_align is not a power of two")
                  if (segment["p_vaddr"] - segment["p_offset"]) % align:
                      issues.append(f"PT_LOAD[{index}]: p_vaddr/p_offset alignment incongruent")
              flag_set = set(segment["p_flags"].split())
              if "W" in flag_set and "E" in flag_set:
                  issues.append(f"PT_LOAD[{index}]: writable+executable (W^X violation)")

          page_size = 4096
          for left_index, left in enumerate(loads):
              if left["p_memsz"] == 0:
                  continue
              left_start = left["p_vaddr"]
              left_end = left_start + left["p_memsz"]
              for right_index in range(left_index + 1, len(loads)):
                  right = loads[right_index]
                  if right["p_memsz"] == 0:
                      continue
                  right_start = right["p_vaddr"]
                  right_end = right_start + right["p_memsz"]
                  if max(left_start, right_start) < min(left_end, right_end):
                      issues.append(
                          f"PT_LOAD[{left_index}] and PT_LOAD[{right_index}]: "
                          "byte-range overlap"
                      )
                  left_pages = set(range(left_start // page_size, (left_end - 1) // page_size + 1))
                  right_pages = set(range(right_start // page_size, (right_end - 1) // page_size + 1))
                  if left_pages & right_pages and left["p_flags"] != right["p_flags"]:
                      issues.append(
                          f"PT_LOAD[{left_index}] and PT_LOAD[{right_index}]: "
                          "shared 4-KiB page with differing flags"
                      )

          report = {
              "schema": "globusos.init-elf-program-headers.v1",
              "elf": str(elf),
              "elf_size": elf.stat().st_size,
              "page_size": page_size,
              "pt_load_count": len(loads),
              "pt_load": loads,
              "issues": issues,
              "contract_status": "valid" if not issues else "invalid",
          }
          pathlib.Path("target/elf-evidence/init-elf-program-headers.json").write_text(
              json.dumps(report, indent=2) + "\n"
          )
          with pathlib.Path("target/elf-evidence/init-elf-contract-report.txt").open("w") as out:
              out.write(f"contract_status={report['contract_status']}\n")
              out.write(f"pt_load_count={len(loads)}\n")
              for index, segment in enumerate(loads):
                  out.write(
                      f"PT_LOAD[{index}] "
                      + " ".join(f"{key}={value}" for key, value in segment.items())
                      + "\n"
                  )
              for issue in issues:
                  out.write(f"ISSUE: {issue}\n")
          with open(pathlib.os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"contract_status={report['contract_status']}\n")
          print(pathlib.Path("target/elf-evidence/init-elf-contract-report.txt").read_text())
          PY

      - name: Build BIOS and UEFI images
        id: build_images
        run: |
          mkdir -p target/boot-images
          # Der Boot-Builder ist kein Workspace-Mitglied mehr (Nightly-Zwang
          # des bootloader-Crates). Er wird in seinem Verzeichnis gebaut.
          ( cd modules/atc-shivacore/boot && cargo +nightly run --release -- \
            "$GITHUB_WORKSPACE/target/x86_64-unknown-none/release/shivacore" \
            "$GITHUB_WORKSPACE/target/boot-images" \
            "init=$GITHUB_WORKSPACE/modules/atc-shivacore/init_program/target/x86_64-unknown-none/release/shivacore-init" )

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf

      - name: Verify QEMU CPU model
        run: qemu-system-x86_64 -cpu help | grep -Fq '${{ matrix.qemu_cpu }}'

      - name: BIOS boot smoke test (${{ matrix.cpu }})
        id: bios_smoke
        run: |
          set +e
          timeout 20s qemu-system-x86_64 \
            -cpu ${{ matrix.qemu_cpu }} \
            -drive format=raw,file=target/boot-images/shivacore-bios.img \
            -serial stdio \
            -display none \
            -no-reboot \
            -no-shutdown 2>&1 | tee target/shivacore-qemu-${{ matrix.cpu }}.log
          status=${PIPESTATUS[0]}
          echo "qemu_exit_code=$status" >> "$GITHUB_OUTPUT"
          if ! grep -q "ShivaCore: Kernel-Einstiegspunkt erreicht." target/shivacore-qemu-${{ matrix.cpu }}.log; then
            echo "ShivaCore did not reach kernel_main."
            exit 1
          fi
          if ! grep -q "ShivaCore: CPU vendor=${{ matrix.expected_vendor }} " target/shivacore-qemu-${{ matrix.cpu }}.log; then
            echo "CPU vendor detection did not match expected ${{ matrix.expected_vendor }}."
            cat target/shivacore-qemu-${{ matrix.cpu }}.log
            exit 1
          fi
          if ! grep -q "ShivaCore: CPU HAL compatibility check OK." target/shivacore-qemu-${{ matrix.cpu }}.log; then
            echo "CPU HAL compatibility gate did not pass."
            exit 1
          fi

          if ! grep -q "ShivaCore: ACPI RSDP/root/table checksums validated; tables=" target/shivacore-qemu-${{ matrix.cpu }}.log; then
            echo "ACPI RSDP/root/child-table validation did not pass in BIOS guest."
            cat target/shivacore-qemu-${{ matrix.cpu }}.log
            exit 1
          fi
          if ! grep -q "Programm 'init' aus Ramdisk" target/shivacore-qemu-${{ matrix.cpu }}.log; then
            echo "Das Ramdisk-Programm init wurde nicht aus dem Image geladen."
            cat target/shivacore-qemu-${{ matrix.cpu }}.log
            exit 1
          fi
          if ! grep -q "(Quelle: Ramdisk)" target/shivacore-qemu-${{ matrix.cpu }}.log; then
            echo "PID 1000 startet nicht aus der Ramdisk, sondern aus dem eingebauten Abbild."
            exit 1
          fi
          if ! grep -q "ShivaCore: USER-001 mapped PID=1000" target/shivacore-qemu-${{ matrix.cpu }}.log; then
            echo "USER-001 did not install the first Ring-3 process."
            exit 1
          fi
          if ! grep -q "ShivaCore: SCHED-001 scheduler armed: PID=1000 + PID=1001" target/shivacore-qemu-${{ matrix.cpu }}.log; then
            echo "SCHED-001 scheduler was not armed with two Ring-3 processes."
            exit 1
          fi
          if ! grep -q "ShivaCore: USER-001 entering PID=1000" target/shivacore-qemu-${{ matrix.cpu }}.log; then
            echo "Kernel did not attempt the real Ring-3 IRETQ entry."
            exit 1
          fi
          if ! grep -q "ShivaCore: scheduler preemption -> context switch to PID=1001" target/shivacore-qemu-${{ matrix.cpu }}.log; then
            echo "Timer IRQ did not drive a real scheduler preemption to PID=1001."
            exit 1
          fi
          # PID 1000 is the real Ramdisk init payload. It deliberately exits
          # after its bounded Yield sequence, so the old built-in-process
          # round-trip/register-pattern assertions are not valid here.
          if ! grep -q "ShivaCore: Exit-Syscall PID=Pid(1000) Code=0" target/shivacore-qemu-${{ matrix.cpu }}.log; then
            echo "Ramdisk init did not complete its authorized process exit."
            exit 1
          fi
          if ! grep -q "ShivaCore: Zombie-Reaping: PID=Pid(1000) exit=0" target/shivacore-qemu-${{ matrix.cpu }}.log; then
            echo "Exited Ramdisk init was not reaped by the kernel."
            exit 1
          fi
          if ! grep -q "ShivaCore: nach Exit von PID=Pid(1000) laeuft PID=1001 weiter" target/shivacore-qemu-${{ matrix.cpu }}.log; then
            echo "The second Ring-3 process did not continue after init exit."
            exit 1
          fi
          if ! grep -q "ShivaCore: SCHED-001 register checkpoint PID=1001 RAX=0x2000 RBX=0x2001 R12=0x2012" target/shivacore-qemu-${{ matrix.cpu }}.log; then
            echo "PID=1001 register checkpoint was not preserved."
            exit 1
          fi
          if ! grep -q "ShivaCore: KernelState::boot() -> Done." target/shivacore-qemu-${{ matrix.cpu }}.log; then
            echo "Canonical KernelState::boot() was not reached from kernel_main."
            exit 1
          fi
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            echo "QEMU exited unexpectedly with status $status."
            exit "$status"
          fi

      - name: Locate OVMF UEFI firmware
        id: ovmf
        run: |
          firmware="$(find /usr/share/OVMF /usr/share/ovmf /usr/share/edk2 -type f \
            \( -name 'OVMF_CODE*.fd' -o -name 'edk2-x86_64-code.fd' \) \
            ! -iname '*vars*' 2>/dev/null | sort | head -n 1)"
          if [ -z "$firmware" ]; then
            echo "No OVMF code firmware found after installing ovmf."
            find /usr/share -maxdepth 4 -type f -iname '*ovmf*' -print || true
            exit 1
          fi
          echo "firmware=$firmware" >> "$GITHUB_OUTPUT"
          echo "Using OVMF firmware: $firmware"

      - name: UEFI boot smoke test (${{ matrix.cpu }})
        id: uefi_smoke
        env:
          OVMF_CODE: ${{ steps.ovmf.outputs.firmware }}
        run: |
          set +e
          timeout 20s qemu-system-x86_64 \
            -cpu ${{ matrix.qemu_cpu }} \
            -drive if=pflash,format=raw,readonly=on,file="$OVMF_CODE" \
            -drive format=raw,file=target/boot-images/shivacore-uefi.img \
            -serial stdio \
            -display none \
            -no-reboot \
            -no-shutdown 2>&1 | tee target/shivacore-uefi-${{ matrix.cpu }}.log
          status=${PIPESTATUS[0]}
          echo "qemu_exit_code=$status" >> "$GITHUB_OUTPUT"
          log=target/shivacore-uefi-${{ matrix.cpu }}.log
          if ! grep -q "ShivaCore: Kernel-Einstiegspunkt erreicht." "$log"; then
            echo "UEFI boot did not reach kernel_main."
            cat "$log"
            exit 1
          fi
          if ! grep -q "ShivaCore: CPU vendor=${{ matrix.expected_vendor }} " "$log"; then
            echo "UEFI CPU vendor detection did not match expected ${{ matrix.expected_vendor }}."
            cat "$log"
            exit 1
          fi
          for expected in \
            "ShivaCore: CPU HAL compatibility check OK." \
            "ShivaCore: ACPI RSDP/root/table checksums validated; tables=" \
            "ShivaCore: KernelState::boot() -> Done." \
            "ShivaCore: USER-001 mapped PID=1000" \
            "ShivaCore: SCHED-001 scheduler armed: PID=1000 + PID=1001" \
            "ShivaCore: USER-001 entering PID=1000" \
            "ShivaCore: scheduler preemption -> context switch to PID=1001" \
            "ShivaCore: Exit-Syscall PID=Pid(1000) Code=0" \
            "ShivaCore: Zombie-Reaping: PID=Pid(1000) exit=0" \
            "ShivaCore: nach Exit von PID=Pid(1000) laeuft PID=1001 weiter" \
            "ShivaCore: SCHED-001 register checkpoint PID=1001 RAX=0x2000 RBX=0x2001 R12=0x2012"; do
            if ! grep -Fq "$expected" "$log"; then
              echo "UEFI boot acceptance marker missing: $expected"
              cat "$log"
              exit 1
            fi
          done
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            echo "UEFI QEMU exited unexpectedly with status $status."
            exit "$status"
          fi

      - name: Create SHA-bound boot evidence manifest
        id: boot_evidence
        if: always()
        shell: bash
        env:
          BUILD_KERNEL_OUTCOME: ${{ steps.build_kernel.outcome || 'unknown' }}
          BUILD_IMAGES_OUTCOME: ${{ steps.build_images.outcome || 'unknown' }}
          BIOS_SMOKE_OUTCOME: ${{ steps.bios_smoke.outcome || 'unknown' }}
          BIOS_QEMU_EXIT_CODE: ${{ steps.bios_smoke.outputs.qemu_exit_code || 'not-recorded' }}
          UEFI_SMOKE_OUTCOME: ${{ steps.uefi_smoke.outcome || 'unknown' }}
          UEFI_QEMU_EXIT_CODE: ${{ steps.uefi_smoke.outputs.qemu_exit_code || 'not-recorded' }}
          INIT_ELF_CONTRACT_STATUS: ${{ steps.init_elf_evidence.outputs.contract_status || 'not-recorded' }}
        run: |
          set -u
          mkdir -p target/boot-evidence
          manifest="target/boot-evidence/manifest-${{ matrix.cpu }}.txt"
          {
            echo "schema=globusos.boot-evidence.v1"
            echo "source_sha=$(git rev-parse HEAD)"
            echo "github_sha=${GITHUB_SHA:-unknown}"
            echo "workflow_ref=${GITHUB_WORKFLOW_REF:-unknown}"
            echo "workflow_sha=${GITHUB_WORKFLOW_SHA:-unknown}"
            echo "run_id=${GITHUB_RUN_ID:-unknown}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT:-unknown}"
            echo "job=${GITHUB_JOB:-unknown}"
            echo "matrix_cpu=${{ matrix.cpu }}"
            echo "runner_os=${RUNNER_OS:-unknown}"
            echo "build_kernel_outcome=$BUILD_KERNEL_OUTCOME"
            echo "build_images_outcome=$BUILD_IMAGES_OUTCOME"
            echo "bios_smoke_outcome=$BIOS_SMOKE_OUTCOME"
            echo "bios_qemu_exit_code=$BIOS_QEMU_EXIT_CODE"
            echo "uefi_smoke_outcome=$UEFI_SMOKE_OUTCOME"
            echo "uefi_qemu_exit_code=$UEFI_QEMU_EXIT_CODE"
            echo "init_elf_contract_status=$INIT_ELF_CONTRACT_STATUS"
            echo "secure_boot_status=RESIDUAL_NOT_ASSERTED"
            echo "acpi_guest_validation=RESIDUAL_NOT_ASSERTED"
            echo "bare_metal_status=NOT_TESTED_BY_QEMU"
            echo "artifact_sha256_begin"
            for artifact in \
              target/elf-evidence/shivacore-init.elf \
              target/elf-evidence/init-elf-program-headers.txt \
              target/elf-evidence/init-elf-program-headers.json \
              target/elf-evidence/init-elf-contract-report.txt \
              target/boot-images/shivacore-bios.img \
              target/boot-images/shivacore-uefi.img \
              "target/shivacore-qemu-${{ matrix.cpu }}.log" \
              "target/shivacore-uefi-${{ matrix.cpu }}.log"; do
              if [ -f "$artifact" ]; then
                sha256sum "$artifact"
              else
                echo "MISSING  $artifact"
              fi
            done
            echo "artifact_sha256_end"
          } > "$manifest"
          cat "$manifest"

      - name: Upload boot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shivacore-boot-images-${{ matrix.cpu }}
          path: |
            target/elf-evidence/shivacore-init.elf
            target/elf-evidence/init-elf-program-headers.txt
            target/elf-evidence/init-elf-program-headers.json
            target/elf-evidence/init-elf-contract-report.txt
            target/boot-images/shivacore-bios.img
            target/boot-images/shivacore-uefi.img
            target/shivacore-qemu-${{ matrix.cpu }}.log
            target/shivacore-uefi-${{ matrix.cpu }}.log
            target/boot-evidence/manifest-${{ matrix.cpu }}.txt

      - name: Enforce init ELF segment contract
        if: always()
        shell: bash
        env:
          CONTRACT_STATUS: ${{ steps.init_elf_evidence.outputs.contract_status || 'not-recorded' }}
        run: |
          case "$CONTRACT_STATUS" in
            valid)
              echo "Init ELF PT_LOAD contract passed."
              ;;
            invalid)
              echo "Init ELF PT_LOAD contract failed; inspect the uploaded elf-evidence artifact."
              exit 1
              ;;
            *)
              echo "Init ELF evidence was not produced; preserving the earlier build/evidence failure."
              ;;
          esac
