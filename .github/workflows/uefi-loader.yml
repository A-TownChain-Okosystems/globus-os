name: UEFI Loader CI

on:
  pull_request:
    paths:
      - 'boot/uefi-loader/**'
      - '.github/workflows/uefi-loader.yml'
  push:
    branches: [main]
    paths:
      - 'boot/uefi-loader/**'
      - '.github/workflows/uefi-loader.yml'

permissions:
  contents: read

jobs:
  build-uefi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-uefi
      - name: Check UEFI loader
        working-directory: boot/uefi-loader
        run: cargo check --target x86_64-unknown-uefi
      - name: Build UEFI loader
        working-directory: boot/uefi-loader
        run: cargo build --release --target x86_64-unknown-uefi
