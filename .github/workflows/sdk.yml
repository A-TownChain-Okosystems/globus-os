name: SDK Build and Test
on:
  push:
  pull_request:
jobs:
  cargo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain aus rust-toolchain.toml (verbindlich 1.100.0)
        run: |
          rustup show active-toolchain
          rustc -vV | grep -qx 'release: 1.100.0'
          rustc -Vv
          cargo -V
      - name: Build
        run: cargo check --manifest-path sdk/Cargo.toml
      - name: Test
        run: cargo test --manifest-path sdk/Cargo.toml
