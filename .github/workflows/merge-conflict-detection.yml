name: Merge Conflict Detection

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: merge-conflict-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  merge-conflict:
    name: Merge Conflict Detection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate event and commit identities
        if: github.event_name == 'pull_request'
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid PR head SHA"; exit 1; }
          [[ "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid PR base SHA"; exit 1; }
          [[ -n "$PR_HEAD_REPO" && "$REPOSITORY" == "A-TownChain-Okosystems/globus-os" ]] || {
            echo "::error::Unexpected repository identity"; exit 1;
          }
          echo "Repository: $REPOSITORY"
          echo "Base SHA: $PR_BASE_SHA"
          echo "Head SHA: $PR_HEAD_SHA"

      - name: Checkout exact PR head
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Detect merge conflicts against exact base
        if: github.event_name == 'pull_request'
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA" || {
            echo "::error::Checkout SHA does not match the PR head SHA"; exit 1;
          }

          git fetch --no-tags origin "$BASE_REF"
          CURRENT_BASE_SHA="$(git rev-parse FETCH_HEAD)"
          if [ "$CURRENT_BASE_SHA" != "$PR_BASE_SHA" ]; then
            echo "::error::STALE: target branch changed after this run's event snapshot."
            echo "Event base: $PR_BASE_SHA"
            echo "Current base: $CURRENT_BASE_SHA"
            exit 1
          fi

          if ! git cat-file -e "$PR_BASE_SHA^{commit}" 2>/dev/null; then
            echo "::error::Base commit is unavailable"; exit 1
          fi
          if ! git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA" >/dev/null; then
            echo "::error::No merge base found"; exit 1
          fi

          report="$RUNNER_TEMP/merge-conflict-report.txt"
          {
            echo "schema=globusos.merge-conflict-report.v1"
            echo "repository=$GITHUB_REPOSITORY"
            echo "pull_request=$PR_NUMBER"
            echo "base_sha=$PR_BASE_SHA"
            echo "head_sha=$PR_HEAD_SHA"
            echo "merge_base=$(git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA")"
          } > "$report"

          set +e
          git merge-tree --write-tree "$PR_BASE_SHA" "$PR_HEAD_SHA" > "$RUNNER_TEMP/merge-tree.out" 2> "$RUNNER_TEMP/merge-tree.err"
          merge_status=$?
          set -e

          if [ "$merge_status" -eq 0 ]; then
            echo "status=PASS" >> "$report"
            echo "Merge tree is conflict-free for the exact event SHAs."
          elif [ "$merge_status" -eq 1 ]; then
            echo "status=BLOCKED" >> "$report"
            echo "conflict_details_begin" >> "$report"
            cat "$RUNNER_TEMP/merge-tree.out" >> "$report"
            cat "$RUNNER_TEMP/merge-tree.err" >> "$report"
            echo "conflict_details_end" >> "$report"
            cat "$report"
            echo "::error::Git reports merge conflicts; resolve them before merging."
            exit 1
          else
            echo "status=ERROR_BLOCKED" >> "$report"
            cat "$RUNNER_TEMP/merge-tree.err" >> "$report"
            cat "$report"
            echo "::error::Merge-tree failed unexpectedly; refusing to pass."
            exit 1
          fi
          cat "$report"

      - name: Validate detector with synthetic merge fixtures
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          git -C "$tmp" init -q
          git -C "$tmp" config user.name "CI Merge Conflict Test"
          git -C "$tmp" config user.email "ci@example.invalid"
          printf 'value=base\n' > "$tmp/sample.txt"
          git -C "$tmp" add sample.txt
          git -C "$tmp" commit -qm base
          base="$(git -C "$tmp" rev-parse HEAD)"
          git -C "$tmp" checkout -qb left
          printf 'value=left\n' > "$tmp/sample.txt"
          git -C "$tmp" commit -qam left
          left="$(git -C "$tmp" rev-parse HEAD)"
          git -C "$tmp" checkout -q "$base"
          git -C "$tmp" checkout -qb right
          printf 'value=right\n' > "$tmp/sample.txt"
          git -C "$tmp" commit -qam right
          right="$(git -C "$tmp" rev-parse HEAD)"
          set +e
          git -C "$tmp" merge-tree --write-tree "$left" "$right" > "$tmp/conflict.out" 2> "$tmp/conflict.err"
          conflict_status=$?
          set -e
          if [ "$conflict_status" -ne 1 ]; then
            echo "::error::Synthetic conflict fixture was not detected (exit=$conflict_status)"
            cat "$tmp/conflict.out" "$tmp/conflict.err"
            exit 1
          fi
          git -C "$tmp" checkout -q "$base"
          git -C "$tmp" checkout -qb clean
          printf 'extra=clean\n' > "$tmp/clean.txt"
          git -C "$tmp" add clean.txt
          git -C "$tmp" commit -qm clean
          clean="$(git -C "$tmp" rev-parse HEAD)"
          set +e
          git -C "$tmp" merge-tree --write-tree "$base" "$clean" > "$tmp/clean.out" 2> "$tmp/clean.err"
          clean_status=$?
          set -e
          if [ "$clean_status" -ne 0 ]; then
            echo "::error::Conflict-free fixture incorrectly failed (exit=$clean_status)"
            cat "$tmp/clean.out" "$tmp/clean.err"
            exit 1
          fi
          echo "Synthetic conflict and conflict-free fixtures passed."

