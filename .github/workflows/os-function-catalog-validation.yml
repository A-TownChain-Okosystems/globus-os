name: OS Function Catalog Validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-os-function-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate catalog and contract metadata
        run: python3 tools/validate_os_function_catalog.py
      - name: Run validator negative tests
        run: python3 tests/test_os_function_catalog_validator.py
