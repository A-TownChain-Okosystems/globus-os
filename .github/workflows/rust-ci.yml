name: Rust CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Aktuelles Rust Stable (MSRV 1.100, deklariert in jeder Cargo.toml).
      # Nightly bleibt allein dem Kernel-Boot-Image vorbehalten (build-std).
      - name: Toolchain aus rust-toolchain.toml (verbindlich 1.100.0)
        run: |
          rustup target add x86_64-unknown-uefi
          rustup show active-toolchain
          rustc -vV | grep -qx 'release: 1.100.0'
          rustc -Vv
          cargo -V
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Build workspace
        run: cargo check --workspace --all-targets
      - name: Test workspace
        run: cargo test --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: ShivaCore kernel library tests
        working-directory: modules/atc-shivacore/kernel
        env:
          RUSTFLAGS: '--cfg curve25519_dalek_backend="serial"'
        run: cargo test --lib
      - name: ShivaCore kernel clippy
        working-directory: modules/atc-shivacore/kernel
        env:
          RUSTFLAGS: '--cfg curve25519_dalek_backend="serial"'
        run: cargo clippy --lib -- -D warnings
