[workspace]
resolver = "2"
# Der Boot-Image-Builder haengt am `bootloader`-Crate und braucht Nightly.
# Als Workspace-Mitglied zwingt er `cargo test --workspace` auf Stable in einen
# Nightly-Build und laesst den ganzen Workspace scheitern. Er ist deshalb ein
# eigenes Crate mit eigenem Workspace; gebaut wird er in seinem Verzeichnis.
exclude = ["modules/atc-shivacore/boot"]
members = [
  "system/core","system/ipc","system/security","system/process","system/memory","system/vfs","system/net",
  "system/devices","system/services","system/graphics","system/audio","system/media","system/package","system/update",
  "system/runtime","system/virtualization","system/identity","system/wallet-service","system/settings","system/aurora-core","system/diagnostics",
  "system/shivacore-api","modules/atc-shivacore/kernel","sdk","modules/atc-bootloader","modules/atc-drivers","modules/atc-globus-shell",
  "modules/atc-linux-edition","modules/atc-shivacore/service_space","modules/atc-windows-edition",
]
[workspace.package]
version = "0.1.0"
edition = "2024"
# Aktuelles Rust Stable (1.100.0, 09.11.2026). Edition 2024 verlangt >= 1.85,
# aurora-core und seine Abhaengigkeiten >= 1.89; ab hier ist Stable die Basis.
rust-version = "1.100"
license = "Apache-2.0"
repository = "https://github.com/A-TownChain-Okosystems/globus-os"
[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"
[workspace.lints.clippy]
all = "warn"

# Kernel-Image: eigene Panik-Strategie.
#
# Der Image-Builder (modules/atc-shivacore/boot) kompiliert den Kernel nicht,
# er nimmt einen fertig gebauten ELF entgegen. Die Strategie des Kernel-Binaries
# haengt deshalb an dem Profil, mit dem es gebaut wird, und das wird hier
# festgelegt statt beim Aufrufer gelassen. `panic = "abort"` heisst: im Kernel
# gibt es keine Entfaltung, ein Panik endet an der Panikstelle. Fuer
# Test- und Host-Builds bleibt das Standardprofil `release`/`test` mit
# Entfaltung, damit `should_panic`-Tests weiter funktionieren.
[profile.kernel]
inherits = "release"
panic = "abort"
