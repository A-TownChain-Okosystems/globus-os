[package]
name = "globus-entropy-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# ChaCha20 als Stromchiffre fuer den DRBG. Grund fuer genau diese Abhaengigkeit:
# sie ist `no_std` und uebersetzt fuer `x86_64-unknown-none` (mit Rust 1.100.0
# nachgewiesen), im Unterschied zu `sha2`, das fuer dieses Ziel scheitert
# (Befund 07.11.2026). Der Kern bringt keine eigene Chiffre mit.
#
# Feature `zeroize` schaltet `cipher/zeroize` frei: der Schluessel und der
# Keystromzustand werden beim Verwerfen genullt (REQ-REC-17).
#
# 0.9.1 ist bewusst gewaehlt und gepinnt: die Build-Warnung
# "future-incompatible" betrifft 0.10.2 genauso (am 14.11.2026 gegengeprueft),
# ein Wechsel bringt also keinen Gewinn, kostet aber das Feature `cipher`.
chacha20 = { version = "=0.9.1", default-features = false, features = ["zeroize"] }
zeroize = { version = "1", default-features = false }

[lints]
workspace = true
