[package]
name = "boot"
version = "0.1.0"
edition = "2021"
description = "ShivaCore Boot-Image-Builder — erzeugt BIOS/UEFI Disk-Images aus dem ShivaCore-Kernel-Binary"

[dependencies]
bootloader = "0.11"
# Nur fuer das Ramdisk-Verzeichnis (Format SRAM): der Bau liegt im Kernel-Crate,
# damit Werkzeug und Kernel nicht zwei Fassungen des Formats pflegen.
shivacore = { path = "../kernel" }

# Eigenes Crate, nicht Teil des Root-Workspace: der `bootloader`-Crate verlangt
# Nightly, waehrend der Rest des Workspace auf Stable testbar bleibt.
[workspace]
