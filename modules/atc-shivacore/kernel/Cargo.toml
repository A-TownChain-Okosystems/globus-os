[package]
name = "shivacore"
version = "0.1.0"
rust-version = "1.100"
edition = "2024"
description = "ShivaCore Kernel — implementiert ATS-1000, eigener Kernel ohne Linux-Unterbau"

[[bin]]
name = "shivacore"
test = false
bench = false
required-features = ["x86-boot"]

[lib]
name = "shivacore"
path = "src/lib.rs"
test = true
bench = false
crate-type = ["lib"]

[features]
default = []
x86-boot = ["dep:bootloader_api", "dep:x86_64", "dep:uart_16550", "dep:pic8259", "dep:noto-sans-mono-bitmap"]

[dependencies]
bootloader_api = { version = "0.11", optional = true }
spin = "0.12"
x86_64 = { version = "0.15", optional = true }
uart_16550 = { version = "0.8", optional = true }
pic8259 = { version = "0.11", optional = true }
lazy_static = { version = "1.5", features = ["spin_no_std"] }
linked_list_allocator = "0.10"
noto-sans-mono-bitmap = { version = "0.3", default-features = false, features = ["regular", "size_16", "unicode-basic-latin", "unicode-latin-1-supplement"], optional = true }
globus-diagnostics = { path = "../../../system/diagnostics" }
libshivacore = { path = "../../../system/shivacore-api" }

# Cargo ignoriert [profile.*] in Nicht-Wurzel-Paketen, die Panik-Strategie des
# Kernel-Builds laesst sich hier also nicht setzen. Der Image-Builder
# (modules/atc-shivacore/boot) fuehrt kein Profil, dort gilt der Cargo-Standard
# "unwind". Der Punkt ist offen und im Doku-Befund festgehalten.

# Cargo erlaubt `lints.workspace = true` nicht zusammen mit einer Abweichung,
# deshalb stehen die Workspace-Werte hier ausgeschrieben. Der Kernel greift an
# definierten Stellen unmittelbar auf Hardware zu; jede dieser Stellen traegt
# eine Safety-Begruendung, deshalb ist `unsafe_code` hier freigestellt.
[lints.rust]
unsafe_code = "allow"
missing_docs = "warn"

[lints.clippy]
all = "warn"
