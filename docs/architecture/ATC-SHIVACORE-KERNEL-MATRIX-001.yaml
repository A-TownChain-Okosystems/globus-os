matrix_id: ATC-SHIVACORE-KERNEL-MATRIX-001
schema_version: "1.0"
title: ShivaCore Kernel Subsystem Matrix
version: "1.2.1"
canonical_source_of_truth: modules/atc-shivacore/kernel/
support_repository: A-TownChain-Okosystems/atc-shivacore
support_repository_kernel_sot: false
evidence_policy: "Architecture != Implementation != Evidence; source presence alone never proves implementation or verification."
status_model: [UNANALYZED, ANALYZED, FIXED, RERUNNING, VERIFIED, RESIDUAL]
source_mapping_status: "EXISTING_FIRST_CANDIDATE_MAPPING"
evidence_fields: [id, domain, function, responsibility, input, output, state, capability, security_boundary, source, test, workflow, exact_sha, run, job, step, exit_code, log, verification, residual]
workflow:
  path: .github/workflows/shivacore-kernel.yml
  scope: "Build and BIOS/QEMU smoke evidence; not proof of all matrix functions."
  exact_sha_required: true
  exact_sha_is_evidence_policy_not_workflow_gate: true
  gates:
    - Rust nightly x86_64 build
    - BIOS and UEFI image build
    - QEMU CPU model validation
    - BIOS QEMU smoke test
    - Intel Skylake matrix leg
    - AMD EPYC matrix leg
    - CPU vendor detection
    - CPU HAL compatibility
    - Ring-3 process mapping and entry
    - scheduler preemption and context switching
    - register checkpoints
    - KernelState::boot()
    - boot artifacts and logs
  limitations:
    - "The current workflow does not execute a dedicated UEFI boot smoke test."
    - "The current workflow does not contain an explicit Exact-SHA assertion; Exact-SHA remains an evidence acceptance requirement."
tcb_domains:
  included: [Boot, CPU/HAL, Memory, Capability, Scheduler, IPC, Interrupt, Timer, Fault, Userspace, ABI]
  excluded: [GlobusOS Services, Aurora AI, Blockchain State, ATC-VM, ATCLang, Network Policy, Filesystem Policy, UI, Application Policy]
